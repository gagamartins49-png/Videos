name: Renderizar Short — pular no elevador despencando (9:16, 62 s)

# Projeto E se? • Experimento #006 • protagonista: O Interrogador.
# Quadros JPEG vão direto (stdin/pipe) para o FFmpeg — nada é salvo em disco.
# O vídeo é dividido em partes paralelas e unido no final em short_elevador_pular_ultimo_segundo.mp4.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'short_elevador/**'
      - '.github/workflows/render-short-elevador.yml'

concurrency:
  group: render-short-elevador-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PARTES: 8

jobs:
  audio:
    name: Narração (edge-tts) + efeitos + envelope da voz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar FFmpeg
        run: |
          # 1) apt (rápido quando o espelho funciona) — com tempo-limite curto
          if ! command -v ffmpeg >/dev/null; then
            (sudo timeout 120 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update -qq && \
             sudo timeout 180 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y -qq ffmpeg) || echo "apt indisponível"
          fi
          # 2) se o apt falhar, baixa um FFmpeg estático (com libx264/mp3) das releases do GitHub
          if ! command -v ffmpeg >/dev/null; then
            curl -fsSL --retry 5 --retry-delay 5 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            sudo mkdir -p /opt/ffmpeg && sudo tar -xJf /tmp/ffmpeg.tar.xz -C /opt/ffmpeg --strip-components=1
            sudo ln -sf /opt/ffmpeg/bin/ffmpeg /usr/local/bin/ffmpeg && sudo ln -sf /opt/ffmpeg/bin/ffprobe /usr/local/bin/ffprobe
          fi
          command -v ffmpeg && ffmpeg -hide_banner -version | head -1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências Python
        run: pip install edge-tts numpy scipy
      - name: Calcular instantes dos sons (mesma física do vídeo)
        run: mkdir -p short_elevador/build && node short_elevador/eventos.mjs > short_elevador/build/eventos.json
      - name: Gerar trilha (62 s, loop)
        run: python short_elevador/gerar_audio.py --out short_elevador/build
      - uses: actions/upload-artifact@v4
        with:
          name: audio-short
          path: |
            short_elevador/build/audio_short.wav
            short_elevador/build/audio_short_sem_narracao.wav
            short_elevador/build/audio_short.mp3
            short_elevador/build/narracao_tempos.json
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: envelope-short
          path: short_elevador/build/envelope.json
          retention-days: 3

  render:
    name: Render (parte ${{ matrix.parte }})
    needs: audio
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        parte: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar FFmpeg e fontes
        run: |
          # 1) apt (rápido quando o espelho funciona) — com tempo-limite curto
          if ! command -v ffmpeg >/dev/null; then
            (sudo timeout 120 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update -qq && \
             sudo timeout 180 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y -qq ffmpeg) || echo "apt indisponível"
          fi
          # 2) se o apt falhar, baixa um FFmpeg estático (com libx264/mp3) das releases do GitHub
          if ! command -v ffmpeg >/dev/null; then
            curl -fsSL --retry 5 --retry-delay 5 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            sudo mkdir -p /opt/ffmpeg && sudo tar -xJf /tmp/ffmpeg.tar.xz -C /opt/ffmpeg --strip-components=1
            sudo ln -sf /opt/ffmpeg/bin/ffmpeg /usr/local/bin/ffmpeg && sudo ln -sf /opt/ffmpeg/bin/ffprobe /usr/local/bin/ffprobe
          fi
          command -v ffmpeg && ffmpeg -hide_banner -version | head -1
      - name: Instalar Playwright + Chromium
        working-directory: short_elevador
        run: |
          npm ci --no-audit --no-fund
          timeout 600 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Baixar envelope da voz (sincronia do Interrogador)
        uses: actions/download-artifact@v4
        with:
          name: envelope-short
          path: short_elevador/build
      - name: Renderizar quadros -> FFmpeg (pipe)
        run: node short_elevador/render.mjs --parte ${{ matrix.parte }} --partes ${{ env.PARTES }} --out short_elevador/build/parte_${{ matrix.parte }}.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: parte-${{ matrix.parte }}
          path: short_elevador/build/parte_${{ matrix.parte }}.mp4
          compression-level: 0
          retention-days: 2

  montar:
    name: Montar short_elevador_pular_ultimo_segundo.mp4
    needs: [audio, render]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Instalar FFmpeg
        run: |
          # 1) apt (rápido quando o espelho funciona) — com tempo-limite curto
          if ! command -v ffmpeg >/dev/null; then
            (sudo timeout 120 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update -qq && \
             sudo timeout 180 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y -qq ffmpeg) || echo "apt indisponível"
          fi
          # 2) se o apt falhar, baixa um FFmpeg estático (com libx264/mp3) das releases do GitHub
          if ! command -v ffmpeg >/dev/null; then
            curl -fsSL --retry 5 --retry-delay 5 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            sudo mkdir -p /opt/ffmpeg && sudo tar -xJf /tmp/ffmpeg.tar.xz -C /opt/ffmpeg --strip-components=1
            sudo ln -sf /opt/ffmpeg/bin/ffmpeg /usr/local/bin/ffmpeg && sudo ln -sf /opt/ffmpeg/bin/ffprobe /usr/local/bin/ffprobe
          fi
          command -v ffmpeg && ffmpeg -hide_banner -version | head -1
      - uses: actions/download-artifact@v4
        with:
          pattern: parte-*
          path: build/partes
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: audio-short
          path: build/audio
      - name: Unir partes + áudio
        run: |
          ls build/partes/parte_*.mp4 | sort -V | sed "s#^#file '$PWD/#; s#\$#'#" > build/lista.txt
          cat build/lista.txt
          ffmpeg -y -v error -f concat -safe 0 -i build/lista.txt -c copy build/video_mudo.mp4
          for pair in "audio_short.wav:short_elevador_pular_ultimo_segundo.mp4" "audio_short_sem_narracao.wav:short_elevador_pular_ultimo_segundo_sem_narracao.mp4"; do
            a="${pair%%:*}"; o="${pair##*:}"
            ffmpeg -y -v error -i build/video_mudo.mp4 -i "build/audio/$a" -map 0:v:0 -map 1:a:0 -c:v copy \
              -c:a aac -b:a 192k -ar 44100 -t 62 -movflags +faststart "$o"
            ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of compact "$o"
          done
      - name: Salvar MP4 como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: short_elevador_pular_ultimo_segundo
          path: |
            short_elevador_pular_ultimo_segundo.mp4
            short_elevador_pular_ultimo_segundo_sem_narracao.mp4
          compression-level: 0
          retention-days: 30
      - name: Publicar na Release "short-elevador" (download direto no celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete short-elevador --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create short-elevador short_elevador_pular_ultimo_segundo.mp4 short_elevador_pular_ultimo_segundo_sem_narracao.mp4 -R "$GITHUB_REPOSITORY" \
            --target "${GITHUB_SHA}" \
            --title "Projeto E se? #006 — E se você pulasse no último segundo de um elevador despencando? (Short 9:16)" \
            --notes "Renderizado automaticamente a partir do commit ${GITHUB_SHA}. short_elevador_pular_ultimo_segundo.mp4 = com narração; short_elevador_pular_ultimo_segundo_sem_narracao.mp4 = só efeitos."
