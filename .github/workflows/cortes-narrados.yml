name: Cortes com narração (apresentação + like/inscreva-se)

# Usa o vídeo anexado à Release "fonte-cortes" e a lista de cortes em cortes/narrados.json.
# Publica os cortes na Release "cortes-narrados".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cortes/narrados.json'
      - 'cortes/cortes_narrados.py'
      - '.github/workflows/cortes-narrados.yml'

concurrency:
  group: cortes-narrados-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cortes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar FFmpeg e edge-tts
        run: |
          (sudo timeout 120 apt-get update -qq && sudo timeout 180 apt-get install -y -qq ffmpeg fonts-dejavu-core) || true
          if ! command -v ffmpeg >/dev/null; then
            curl -fsSL --retry 5 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            sudo mkdir -p /opt/ffmpeg && sudo tar -xJf /tmp/ffmpeg.tar.xz -C /opt/ffmpeg --strip-components=1
            sudo ln -sf /opt/ffmpeg/bin/ffmpeg /usr/local/bin/ffmpeg && sudo ln -sf /opt/ffmpeg/bin/ffprobe /usr/local/bin/ffprobe
          fi
          pip install edge-tts
      - name: Baixar o vídeo-fonte (Release fonte-cortes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/fonte && gh release download fonte-cortes -R "$GITHUB_REPOSITORY" -D /tmp/fonte
          f=$(ls -S /tmp/fonte/* | head -1); mv "$f" /tmp/fonte.mp4; ls -la /tmp/fonte.mp4
      - name: Gerar cortes narrados
        run: python cortes/cortes_narrados.py --fonte /tmp/fonte.mp4 --out cortes/build_narrados
      - name: Publicar na Release "cortes-narrados"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cortes-narrados --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create cortes-narrados cortes/build_narrados/corte_*.mp4 -R "$GITHUB_REPOSITORY" \
            --target "${GITHUB_SHA}" --title "Cortes GTA 6 com narração" --notes "Cortes 9:16 com apresentação da cena no início e chamada de like/inscrição no final (commit ${GITHUB_SHA})."
