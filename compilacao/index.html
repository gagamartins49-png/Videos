<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projeto E se? — Compilação de 7 simulações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:wght@600&family=Roboto+Mono:wght@700&display=block" rel="stylesheet">
<style>
  :root { --bg: #04060b; --fg: #eef4fa; --accent: #3ad7ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
  #view { width: 100%; max-width: 1280px; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; display: block; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1280px; align-items: center; }
  select, button { min-height: 44px; border-radius: 10px; border: 0; padding: 0 14px; font-size: 15px; font-weight: 700; }
  button { background: var(--accent); color: #04121a; cursor: pointer; }
  select { background: rgba(255,255,255,0.12); color: var(--fg); }
  input[type=range] { flex: 1 1 300px; }
  #status { font-size: 14px; opacity: .8; }
  body.capture { padding: 0; } body.capture .row, body.capture #status { display: none; }
</style>
</head>
<body>
<canvas id="view" width="1920" height="1080"></canvas>
<div class="row">
  <select id="bloco" aria-label="Bloco"></select>
  <button id="play">▶ Play</button>
  <input id="seek" type="range" min="0" max="80" step="0.1" value="0" aria-label="Tempo no bloco">
</div>
<div id="status">Carregando…</div>
<script type="module">
import { createCompilation, blockStart } from './js/compilacao.js';
const params = new URLSearchParams(location.search);
const CAPTURE = params.has('capture');
if (CAPTURE) document.body.classList.add('capture');
const $ = (id) => document.getElementById(id);
const cfg = await (await fetch('roteiro.json')).json();
try { await Promise.race([Promise.all(['400 100px "Anton"', '600 40px "Playfair Display"', '700 30px "Roboto Mono"'].map((f) => document.fonts.load(f))), new Promise((r) => setTimeout(r, 8000))]); } catch (e) { /* fallback */ }
let envelope = null;
try { const r = await fetch('build/envelope.json'); if (r.ok) envelope = await r.json(); } catch (e) { /* sem envelope: animação aproximada */ }

const bloco = Math.max(0, Math.min(cfg.blocos.length - 1, parseInt(params.get('bloco') || '0', 10)));
const app = await createCompilation({ cfg, base: '.', blocks: [bloco], envelope });
const view = $('view'), vctx = view.getContext('2d');
const show = (T) => { app.renderFrame(T); vctx.drawImage(app.canvas, 0, 0); };
show(blockStart(cfg, bloco));

window.APP = {
  ready: true, cfg, bloco, start: blockStart(cfg, bloco), dur: cfg.blocos[bloco].dur, fps: cfg.fps,
  frameJPEG: (T, q) => app.frameJPEG(T, q),
  hasEnvelope: !!envelope,
};

if (!CAPTURE) {
  cfg.blocos.forEach((b, i) => { const o = document.createElement('option'); o.value = i; o.textContent = `Bloco ${i} — ${b.titulo} (${b.dur}s)`; if (i === bloco) o.selected = true; $('bloco').appendChild(o); });
  $('bloco').addEventListener('change', () => { location.search = `?bloco=${$('bloco').value}`; });
  $('seek').max = cfg.blocos[bloco].dur;
  $('seek').addEventListener('input', () => show(APP.start + parseFloat($('seek').value)));
  $('status').textContent = envelope ? 'Pronto (com envelope da voz).' : 'Pronto (prévia sem narração — o áudio é gerado no GitHub Actions).';
  let playing = false, t0 = 0, audio = null;
  $('play').addEventListener('click', async () => {
    if (playing) { playing = false; if (audio) audio.pause(); $('play').textContent = '▶ Play'; return; }
    playing = true; $('play').textContent = '■ Parar';
    const from = parseFloat($('seek').value);
    try { const r = await fetch('build/audio_compilacao.mp3', { method: 'HEAD' }); if (r.ok) { audio = audio || new Audio('build/audio_compilacao.mp3'); audio.currentTime = APP.start + from; await audio.play(); } } catch (e) { audio = null; }
    t0 = performance.now() / 1000 - from;
    const loop = () => {
      if (!playing) return;
      const tau = audio && !audio.paused ? audio.currentTime - APP.start : performance.now() / 1000 - t0;
      if (tau >= APP.dur) { playing = false; $('play').textContent = '▶ Play'; if (audio) audio.pause(); return; }
      $('seek').value = tau; show(APP.start + tau); requestAnimationFrame(loop);
    };
    loop();
  });
}
</script>
</body>
</html>
