name: Renderizar Short — "E se você me seguisse / se inscrevesse agora?" (9:16, 40 s, TikTok + YouTube)

# Projeto E se? • Experimento #010 • protagonista: O Interrogador.
# Duas versões: TikTok ("me seguisse") e YouTube ("se inscrevesse"). Quadros JPEG vão direto (pipe)
# para o FFmpeg; cada versão é dividida em 4 partes paralelas e unida no final.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'short_seguir/**'
      - '.github/workflows/render-short-seguir.yml'

concurrency:
  group: render-short-seguir-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PARTES: 4

jobs:
  audio:
    name: Narração + música (${{ matrix.versao }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        versao: [tiktok, youtube]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar FFmpeg
        run: |
          # 1) apt (rápido quando o espelho funciona) — com tempo-limite curto
          if ! command -v ffmpeg >/dev/null; then
            (sudo timeout 120 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update -qq && \
             sudo timeout 180 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y -qq ffmpeg) || echo "apt indisponível"
          fi
          # 2) se o apt falhar, baixa um FFmpeg estático (com libx264/mp3) das releases do GitHub
          if ! command -v ffmpeg >/dev/null; then
            curl -fsSL --retry 5 --retry-delay 5 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            sudo mkdir -p /opt/ffmpeg && sudo tar -xJf /tmp/ffmpeg.tar.xz -C /opt/ffmpeg --strip-components=1
            sudo ln -sf /opt/ffmpeg/bin/ffmpeg /usr/local/bin/ffmpeg && sudo ln -sf /opt/ffmpeg/bin/ffprobe /usr/local/bin/ffprobe
          fi
          command -v ffmpeg && ffmpeg -hide_banner -version | head -1
      - name: Instalar dependências Python
        run: pip install edge-tts numpy scipy
      - name: Gerar trilha (40 s, loop)
        run: python short_seguir/gerar_audio.py --versao ${{ matrix.versao }} --out short_seguir/build
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ matrix.versao }}
          path: |
            short_seguir/build/audio_${{ matrix.versao }}.wav
            short_seguir/build/audio_${{ matrix.versao }}_sem_narracao.wav
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: envelope-${{ matrix.versao }}
          path: short_seguir/build/envelope_${{ matrix.versao }}.json
          retention-days: 3

  render:
    name: Render ${{ matrix.versao }} (parte ${{ matrix.parte }})
    needs: audio
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        versao: [tiktok, youtube]
        parte: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar FFmpeg e fontes
        run: |
          # 1) apt (rápido quando o espelho funciona) — com tempo-limite curto
          if ! command -v ffmpeg >/dev/null; then
            (sudo timeout 120 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update -qq && \
             sudo timeout 180 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y -qq ffmpeg) || echo "apt indisponível"
          fi
          # 2) se o apt falhar, baixa um FFmpeg estático (com libx264/mp3) das releases do GitHub
          if ! command -v ffmpeg >/dev/null; then
            curl -fsSL --retry 5 --retry-delay 5 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            sudo mkdir -p /opt/ffmpeg && sudo tar -xJf /tmp/ffmpeg.tar.xz -C /opt/ffmpeg --strip-components=1
            sudo ln -sf /opt/ffmpeg/bin/ffmpeg /usr/local/bin/ffmpeg && sudo ln -sf /opt/ffmpeg/bin/ffprobe /usr/local/bin/ffprobe
          fi
          command -v ffmpeg && ffmpeg -hide_banner -version | head -1
      - name: Instalar Playwright + Chromium
        working-directory: short_seguir
        run: |
          npm ci --no-audit --no-fund
          timeout 600 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Baixar envelope da voz (boca do Interrogador)
        uses: actions/download-artifact@v4
        with:
          name: envelope-${{ matrix.versao }}
          path: short_seguir/build
      - name: Renderizar quadros -> FFmpeg (pipe)
        run: node short_seguir/render.mjs --versao ${{ matrix.versao }} --parte ${{ matrix.parte }} --partes ${{ env.PARTES }} --out short_seguir/build/parte_${{ matrix.versao }}_${{ matrix.parte }}.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: parte-${{ matrix.versao }}-${{ matrix.parte }}
          path: short_seguir/build/parte_${{ matrix.versao }}_${{ matrix.parte }}.mp4
          compression-level: 0
          retention-days: 2

  montar:
    name: Montar os MP4 (TikTok + YouTube)
    needs: [audio, render]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Instalar FFmpeg
        run: |
          # 1) apt (rápido quando o espelho funciona) — com tempo-limite curto
          if ! command -v ffmpeg >/dev/null; then
            (sudo timeout 120 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update -qq && \
             sudo timeout 180 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y -qq ffmpeg) || echo "apt indisponível"
          fi
          # 2) se o apt falhar, baixa um FFmpeg estático (com libx264/mp3) das releases do GitHub
          if ! command -v ffmpeg >/dev/null; then
            curl -fsSL --retry 5 --retry-delay 5 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            sudo mkdir -p /opt/ffmpeg && sudo tar -xJf /tmp/ffmpeg.tar.xz -C /opt/ffmpeg --strip-components=1
            sudo ln -sf /opt/ffmpeg/bin/ffmpeg /usr/local/bin/ffmpeg && sudo ln -sf /opt/ffmpeg/bin/ffprobe /usr/local/bin/ffprobe
          fi
          command -v ffmpeg && ffmpeg -hide_banner -version | head -1
      - uses: actions/download-artifact@v4
        with:
          pattern: parte-*
          path: build/partes
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: audio-*
          path: build/audio
          merge-multiple: true
      - name: Unir partes + áudio
        run: |
          for v in tiktok youtube; do
            if [ "$v" = tiktok ]; then nome=short_seguir_tiktok; else nome=short_inscrever_youtube; fi
            ls build/partes/parte_${v}_*.mp4 | sort -V | sed "s#^#file '$PWD/#; s#\$#'#" > build/lista_$v.txt
            cat build/lista_$v.txt
            ffmpeg -y -v error -f concat -safe 0 -i build/lista_$v.txt -c copy build/mudo_$v.mp4
            for pair in "audio_${v}.wav:${nome}.mp4" "audio_${v}_sem_narracao.wav:${nome}_sem_narracao.mp4"; do
              a="${pair%%:*}"; o="${pair##*:}"
              ffmpeg -y -v error -i build/mudo_$v.mp4 -i "build/audio/$a" -map 0:v:0 -map 1:a:0 -c:v copy \
                -c:a aac -b:a 192k -ar 44100 -t 40 -movflags +faststart "$o"
              ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of compact "$o"
            done
          done
      - name: Salvar MP4 como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: short_seguir
          path: |
            short_seguir_tiktok.mp4
            short_seguir_tiktok_sem_narracao.mp4
            short_inscrever_youtube.mp4
            short_inscrever_youtube_sem_narracao.mp4
          compression-level: 0
          retention-days: 30
      - name: Publicar na Release "short-seguir" (download direto no celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete short-seguir --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create short-seguir short_seguir_tiktok.mp4 short_seguir_tiktok_sem_narracao.mp4 short_inscrever_youtube.mp4 short_inscrever_youtube_sem_narracao.mp4 -R "$GITHUB_REPOSITORY" \
            --target "${GITHUB_SHA}" \
            --title "Projeto E se? #010 — E se você me seguisse / se inscrevesse agora? (TikTok + YouTube)" \
            --notes "Renderizado automaticamente a partir do commit ${GITHUB_SHA}. short_seguir_tiktok.mp4 = versão TikTok; short_inscrever_youtube.mp4 = versão YouTube; *_sem_narracao = só música e efeitos."
