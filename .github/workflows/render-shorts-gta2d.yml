name: Renderizar Shorts 2D tema GTA 6 (#013 adiado, #014 dentro do jogo, #015 primeiro do mundo)

# Projeto E se? • Experimentos #013–#015 • animação 2D desenhada (Canvas 2D), arte 100% própria.
# Cada vídeo é dividido em partes paralelas; quadros JPEG vão direto (pipe) para o FFmpeg.
# Cada vídeo é publicado na sua própria Release (short-gta2d-<video>).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'shorts_gta2d/**'
      - 'short_tempo/js/arte.js'
      - '.github/workflows/render-shorts-gta2d.yml'

concurrency:
  group: render-shorts-gta2d-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PARTES: 5

jobs:
  audio:
    name: Trilha (${{ matrix.v }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        v: [adiado, dentro, primeiro]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            (sudo timeout 120 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update -qq && \
             sudo timeout 180 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y -qq ffmpeg) || echo "apt indisponível"
          fi
          if ! command -v ffmpeg >/dev/null; then
            curl -fsSL --retry 5 --retry-delay 5 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            sudo mkdir -p /opt/ffmpeg && sudo tar -xJf /tmp/ffmpeg.tar.xz -C /opt/ffmpeg --strip-components=1
            sudo ln -sf /opt/ffmpeg/bin/ffmpeg /usr/local/bin/ffmpeg && sudo ln -sf /opt/ffmpeg/bin/ffprobe /usr/local/bin/ffprobe
          fi
          command -v ffmpeg && ffmpeg -hide_banner -version | head -1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências Python
        run: pip install edge-tts numpy scipy
      - name: Linha do tempo e trilha do vídeo
        run: mkdir -p shorts_gta2d/build/${{ matrix.v }} && node shorts_gta2d/eventos.mjs ${{ matrix.v }} > shorts_gta2d/build/${{ matrix.v }}/eventos.json
      - name: Gerar trilha (62 s, loop)
        run: |
          python shorts_gta2d/gerar_audio.py --v ${{ matrix.v }}
          cat shorts_gta2d/build/${{ matrix.v }}/narracao_tempos.json
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ matrix.v }}
          path: |
            shorts_gta2d/build/${{ matrix.v }}/audio_short.wav
            shorts_gta2d/build/${{ matrix.v }}/audio_short_sem_narracao.wav
          retention-days: 3

  render:
    name: Render ${{ matrix.v }} (parte ${{ matrix.parte }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        v: [adiado, dentro, primeiro]
        parte: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            (sudo timeout 120 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update -qq && \
             sudo timeout 180 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y -qq ffmpeg) || echo "apt indisponível"
          fi
          if ! command -v ffmpeg >/dev/null; then
            curl -fsSL --retry 5 --retry-delay 5 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            sudo mkdir -p /opt/ffmpeg && sudo tar -xJf /tmp/ffmpeg.tar.xz -C /opt/ffmpeg --strip-components=1
            sudo ln -sf /opt/ffmpeg/bin/ffmpeg /usr/local/bin/ffmpeg && sudo ln -sf /opt/ffmpeg/bin/ffprobe /usr/local/bin/ffprobe
          fi
          command -v ffmpeg && ffmpeg -hide_banner -version | head -1
      - name: Instalar Playwright + Chromium
        working-directory: shorts_gta2d
        run: |
          npm ci --no-audit --no-fund
          timeout 600 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Renderizar quadros -> FFmpeg (pipe)
        run: node shorts_gta2d/render.mjs --v ${{ matrix.v }} --parte ${{ matrix.parte }} --partes ${{ env.PARTES }} --out shorts_gta2d/build/${{ matrix.v }}/parte_${{ matrix.parte }}.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: parte-${{ matrix.v }}-${{ matrix.parte }}
          path: shorts_gta2d/build/${{ matrix.v }}/parte_${{ matrix.parte }}.mp4
          compression-level: 0
          retention-days: 2

  montar:
    name: Montar e publicar (${{ matrix.v }})
    needs: [audio, render]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - v: adiado
            arq: short_gta2d_adiado_de_novo
            tag: short-gta2d-adiado
            titulo: "Projeto E se? #013 — E se o GTA 6 fosse adiado de novo? (Short 9:16, animação 2D)"
          - v: dentro
            arq: short_gta2d_acordar_dentro_do_jogo
            tag: short-gta2d-dentro
            titulo: "Projeto E se? #014 — E se você acordasse dentro do GTA 6? (Short 9:16, animação 2D)"
          - v: primeiro
            arq: short_gta2d_primeiro_do_mundo
            tag: short-gta2d-primeiro
            titulo: "Projeto E se? #015 — E se você fosse o primeiro do mundo a jogar GTA 6? (Short 9:16, animação 2D)"
    steps:
      - name: Instalar FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            (sudo timeout 120 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update -qq && \
             sudo timeout 180 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y -qq ffmpeg) || echo "apt indisponível"
          fi
          if ! command -v ffmpeg >/dev/null; then
            curl -fsSL --retry 5 --retry-delay 5 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            sudo mkdir -p /opt/ffmpeg && sudo tar -xJf /tmp/ffmpeg.tar.xz -C /opt/ffmpeg --strip-components=1
            sudo ln -sf /opt/ffmpeg/bin/ffmpeg /usr/local/bin/ffmpeg && sudo ln -sf /opt/ffmpeg/bin/ffprobe /usr/local/bin/ffprobe
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: parte-${{ matrix.v }}-*
          path: build/partes
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: audio-${{ matrix.v }}
          path: build/audio
      - name: Unir partes + áudio
        run: |
          ls build/partes/parte_*.mp4 | sort -V | sed "s#^#file '$PWD/#; s#\$#'#" > build/lista.txt
          cat build/lista.txt
          test "$(wc -l < build/lista.txt)" = "${{ env.PARTES }}"
          ffmpeg -y -v error -f concat -safe 0 -i build/lista.txt -c copy build/video_mudo.mp4
          for pair in "audio_short.wav:${{ matrix.arq }}.mp4" "audio_short_sem_narracao.wav:${{ matrix.arq }}_sem_narracao.mp4"; do
            a="${pair%%:*}"; o="${pair##*:}"
            ffmpeg -y -v error -i build/video_mudo.mp4 -i "build/audio/$a" -map 0:v:0 -map 1:a:0 -c:v copy \
              -c:a aac -b:a 192k -ar 44100 -t 62 -movflags +faststart "$o"
            ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of compact "$o"
          done
      - name: Publicar na Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ${{ matrix.tag }} --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create ${{ matrix.tag }} ${{ matrix.arq }}.mp4 ${{ matrix.arq }}_sem_narracao.mp4 -R "$GITHUB_REPOSITORY" \
            --target "${GITHUB_SHA}" \
            --title "${{ matrix.titulo }}" \
            --notes "Renderizado automaticamente a partir do commit ${GITHUB_SHA}. ${{ matrix.arq }}.mp4 = com narração; _sem_narracao = só música e efeitos. Arte 100% própria (sem logos ou artes oficiais de jogos)."
